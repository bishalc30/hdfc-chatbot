# Changeable, non-secret settings. Secrets and the LLM choice live in .env.

scraping:
  user_agent: "MF-FAQ-RAG-Demo/1.0 (educational project)"
  delay_s: 1.5           # pause between requests
  timeout_s: 20
  retries: 2
  respect_robots: true

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2   # must be the same for ingestion and retrieval
  batch_size: 64

vector_db:
  provider: chromadb
  persist_dir: data/05_vectordb
  collection: hdfc_mf_faq

chunking:
  max_tokens: 250        # MiniLM reads at most 256 tokens
  overlap_tokens: 30

retrieval:
  top_k: 3               # canonical fact questions rank their fact chunk #1 (checked for all funds x facts)
  similarity_threshold: 0.35   # tune in step 7

generation:
  max_sentences: 3
  temperature: 0.0
  max_tokens: 150        # answers are <= 3 sentences + SOURCE line (~50 tokens in practice)
  timeout_s: 12          # one LLM call per factual answer, no retries (fits the page's 20s limit)

cache:
  ttl_hours: 24          # factual answers cached by (fund, fact); repeats make no LLM call

guardrails:
  max_input_chars: 500

# Typo / alias tolerance for routing in src/chat.py (not used by retrieval).
# Each alias is replaced by its canonical phrase before routing. Matching is case-insensitive and
# hyphens count as spaces. Aliases of 5+ letters also match typos ("expence" -> "expense") at
# fuzzy_threshold (difflib similarity, 0-1); shorter ones (ter, sip, elss, risk) must match exactly.
aliases:
  fuzzy_threshold: 0.85
  funds:                 # canonical scheme name: aliases
    HDFC Large Cap Fund: [large cap, largecap]
    HDFC Flexi Cap Fund: [flexi cap, flexicap, flexi]
    HDFC ELSS Tax Saver Fund: [elss, tax saver, taxsaver, tax saving, elss tax saver]
    HDFC Mid Cap Fund: [mid cap, midcap]
  facts:                 # canonical phrase: aliases
    expense ratio: [expense ratio, expense, expenses, ter, total expense ratio]
    exit load: [exit load, exitload, exit charge, exit charges, exit fee]
    minimum sip: [min sip, minimum sip, sip amount, minimum sip amount, min sip amount]
    riskometer: [riskometer, risk o meter, risk, risk level, risk grade]
    benchmark: [benchmark, benchmark index, bench mark]
    lock in: [lock in, lockin, lock in period, lockin period]

links:
  education: https://www.amfiindia.com/investor        # AMFI Investor Corner (linked in advice refusals)

ui:
  show_debug: false      # true = show the "Show pipeline" panel and the sidebar's RAG pipeline section
  welcome: "Hi! Ask me quick facts about HDFC Mutual Fund schemes."
  example_questions:
    - "What is the expense ratio of HDFC Large Cap Fund?"
    - "What is the lock-in period of HDFC ELSS Tax Saver?"
    - "What is the minimum SIP amount for HDFC Mid Cap Fund?"
